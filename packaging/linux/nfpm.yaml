# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages the file tree, substitutes its path
# for ${STAGE} (nfpm doesn't expand env vars in `src`) and exports VERSION, RELEASE, NFPM_ARCH and XMLCRAFT_MAINTAINER.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: xmlcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
# 1 for releases; 1.<label> for a labelled local build (XMLCRAFT_BUILD_LABEL), which sorts after the release of the same version and
# before the next one.
release: ${RELEASE}
section: devel
priority: optional
maintainer: ${XMLCRAFT_MAINTAINER}
vendor: The XmlCraft contributors
homepage: https://github.com/thorstenhirsch/xmlcraft
license: MIT OR Apache-2.0
description: |-
  Open-source XML editor: colours and completes XML, validates it against
  XSD and DTD schemas, and generates schemas and sample files.
  Includes xmlcraft-cli, a headless command runner and opt-in MCP server.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the GPU (Vulkan, EGL/GL) are loaded at
# runtime, so they are dependencies/recommendations here rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    # Library sonames rather than package names, so the same requirements resolve on Fedora/RHEL and openSUSE (which has no
    # libxkbcommon, vulkan-loader or libglvnd-egl package). The glibc floor names libm because the binaries' GLIBC_2.35 symbols are
    # libm's: RHEL 9's glibc 2.34 provides libc.so.6(GLIBC_2.35) through backports, but not this, so it refuses.
    depends:
      - libc.so.6()(64bit)
      - libm.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/xmlcraft
    dst: /usr/bin/xmlcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/xmlcraft-cli
    dst: /usr/bin/xmlcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
