[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/xmlcraft", "apps/xmlcraft-cli", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/thorstenhirsch/xmlcraft"

[workspace.dependencies]
# Shared frontend and platform libraries from the public storytold/craft-libs repository. Every
# craft-* dependency is pinned to the SAME immutable revision (the one PdfCraft builds against), so
# the shared code is audited once. Move them all together.
craft-ui = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "ea4c823abb46fa9d21361604ed1c6d21c54e9ca8", features = ["serde"] }
craft-quit = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "ea4c823abb46fa9d21361604ed1c6d21c54e9ca8" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "ea4c823abb46fa9d21361604ed1c6d21c54e9ca8" }
craft-settings = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "ea4c823abb46fa9d21361604ed1c6d21c54e9ca8" }
craft-window = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "ea4c823abb46fa9d21361604ed1c6d21c54e9ca8" }

# internal
xmlcraft-text = { path = "crates/text", version = "0.0.1" }
xmlcraft-syntax = { path = "crates/syntax", version = "0.0.1" }
xmlcraft-format = { path = "crates/format", version = "0.0.1" }
xmlcraft-catalog = { path = "crates/catalog", version = "0.0.1" }
xmlcraft-schemas = { path = "crates/schemas", version = "0.0.1" }
xmlcraft-pattern = { path = "crates/pattern", version = "0.0.1" }
xmlcraft-datatypes = { path = "crates/datatypes", version = "0.0.1" }
xmlcraft-dtd = { path = "crates/dtd", version = "0.0.1" }
xmlcraft-grammar = { path = "crates/grammar", version = "0.0.1" }
xmlcraft-complete = { path = "crates/complete", version = "0.0.1" }
xmlcraft-validate = { path = "crates/validate", version = "0.0.1" }
xmlcraft-editor = { path = "crates/editor", version = "0.0.1" }
xmlcraft-code-editor = { path = "crates/code-editor", version = "0.0.1" }
xmlcraft-platform = { path = "crates/platform", version = "0.0.1" }
xmlcraft-engine = { path = "crates/engine", version = "0.0.1" }
xmlcraft-automation = { path = "crates/automation", version = "0.0.1" }
xmlcraft-ui-egui = { path = "crates/ui-egui", version = "0.0.1" }

# foundation
crop = "0.4"
rowan = "0.16"
unicode-segmentation = "1"
unicode-width = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa", "dfa-onepass", "hybrid", "perf", "unicode"] }
encoding_rs = "0.8"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
pollster = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies carry no debug info and our own crates only line tables: backtraces and panics still
# show file and line, while test binaries and the target dir stay small.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.low-disk]
inherits = "dev"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
[patch.crates-io]
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
