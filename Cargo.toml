[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/xmlcraft", "apps/xmlcraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/thorstenhirsch/xmlcraft"

[workspace.dependencies]
# Shared frontend and platform libraries from the public storytold/craft-libs repository. Every
# craft-* dependency is pinned to the SAME immutable revision (the one PdfCraft builds against), so
# the shared code is audited once. Move them all together.
craft-ui = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "787a7a0f972fd1d7a7618fdbeca3a5267a0407ff", features = ["serde"] }
craft-quit = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "787a7a0f972fd1d7a7618fdbeca3a5267a0407ff" }
craft-menu = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "787a7a0f972fd1d7a7618fdbeca3a5267a0407ff" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "787a7a0f972fd1d7a7618fdbeca3a5267a0407ff" }
craft-settings = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "787a7a0f972fd1d7a7618fdbeca3a5267a0407ff" }
craft-window = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "787a7a0f972fd1d7a7618fdbeca3a5267a0407ff" }

# internal
xmlcraft-text = { path = "crates/text", version = "0.1.0" }
xmlcraft-syntax = { path = "crates/syntax", version = "0.1.0" }
xmlcraft-json-syntax = { path = "crates/json-syntax", version = "0.1.0" }
xmlcraft-json = { path = "crates/json", version = "0.1.0" }
xmlcraft-bson = { path = "crates/bson", version = "0.1.0" }
xmlcraft-convert = { path = "crates/convert", version = "0.1.0" }
xmlcraft-yaml-syntax = { path = "crates/yaml-syntax", version = "0.1.0" }
xmlcraft-format = { path = "crates/format", version = "0.1.0" }
xmlcraft-catalog = { path = "crates/catalog", version = "0.1.0" }
xmlcraft-schemas = { path = "crates/schemas", version = "0.1.0" }
xmlcraft-resolve = { path = "crates/resolve", version = "0.1.0" }
xmlcraft-pattern = { path = "crates/pattern", version = "0.1.0" }
xmlcraft-datatypes = { path = "crates/datatypes", version = "0.1.0" }
xmlcraft-xbrl = { path = "crates/xbrl", version = "0.1.0" }
xmlcraft-xsd = { path = "crates/xsd", version = "0.1.0" }
xmlcraft-dtd = { path = "crates/dtd", version = "0.1.0" }
xmlcraft-grammar = { path = "crates/grammar", version = "0.1.0" }
xmlcraft-complete = { path = "crates/complete", version = "0.1.0" }
xmlcraft-validate = { path = "crates/validate", version = "0.1.0" }
xmlcraft-query = { path = "crates/query", version = "0.1.0" }
xmlcraft-schematron = { path = "crates/schematron", version = "0.1.0" }
xmlcraft-diff = { path = "crates/diff", version = "0.1.0" }
xmlcraft-einvoice = { path = "crates/einvoice", version = "0.1.0" }
xmlcraft-pdf = { path = "crates/pdf", version = "0.1.0" }
xmlcraft-infer = { path = "crates/infer", version = "0.1.0" }
xmlcraft-sample = { path = "crates/sample", version = "0.1.0" }
xmlcraft-editor = { path = "crates/editor", version = "0.1.0" }
xmlcraft-code-editor = { path = "crates/code-editor", version = "0.1.0" }
xmlcraft-platform = { path = "crates/platform", version = "0.1.0" }
xmlcraft-engine = { path = "crates/engine", version = "0.1.0" }
xmlcraft-automation = { path = "crates/automation", version = "0.1.0" }
xmlcraft-ui-egui = { path = "crates/ui-egui", version = "0.1.0" }

# foundation
crop = "0.4"
rowan = "0.17"
unicode-segmentation = "1"
unicode-width = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-syntax = { version = "0.8", default-features = false, features = ["std", "unicode"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa", "dfa-onepass", "hybrid", "perf", "unicode"] }
encoding_rs = "0.8"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# network (xmlcraft-platform, native only): the same client and TLS set-up as the shared craft-update crate (rustls over the
# operating system's trusted roots; no root list is bundled, so no CDLA-licensed data). No `gzip`: a body is read as it is sent, and
# the size limit counts what was sent.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
sha2 = "0.11"

# testing
proptest = "1"

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
rfd = "0.17"
pollster = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies carry no debug info and our own crates only line tables: backtraces and panics still
# show file and line, while test binaries and the target dir stay small.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.low-disk]
inherits = "dev"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# The egui and winit crates are pinned to immutable storytold git revisions, the same ones PdfCraft builds against (egui
# 6d518fc799681571963842f95b55a6b68431b15a, winit a517b3846ee8457d84ee4975110bfda6797c44dc): the forks carry the input-method,
# DPI and surface fixes PdfCraft needs and the newer craft-ui uses their IME and right-to-left APIs. `vendor/winit` and
# `vendor/egui-wgpu` are kept as provenance for the patches XmlCraft carried before (see vendor/README.md); they are not path patches.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
