[package]
name = "xmlcraft-ui-egui"
description = "The egui shell of XmlCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

# Native file panels; the web build has none.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
pollster = { workspace = true }

[dependencies]
xmlcraft-engine = { workspace = true }
xmlcraft-infer = { workspace = true }
xmlcraft-resolve = { workspace = true }
xmlcraft-sample = { workspace = true }
xmlcraft-format = { workspace = true }
xmlcraft-text = { workspace = true }
xmlcraft-syntax = { workspace = true }
xmlcraft-editor = { workspace = true }
xmlcraft-code-editor = { workspace = true }
xmlcraft-platform = { workspace = true }
xmlcraft-complete = { workspace = true }
xmlcraft-grammar = { workspace = true }
craft-ui = { workspace = true }
# macOS: a window close quits through `terminate:` (the Touch Bar crash); elsewhere a no-op.
craft-quit = { workspace = true, features = ["egui"] }
egui = { workspace = true, features = ["bytemuck"] }
egui_extras = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence", "links"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Control-channel screenshots: PNG-encoded, then base64 in the JSON reply.
png = "0.18"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
