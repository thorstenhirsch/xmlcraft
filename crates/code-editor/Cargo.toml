[package]
name = "xmlcraft-code-editor"
description = "XmlCraft's code editor widget for egui: a virtualised text view with gutter, carets, selections and IME"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xmlcraft-text = { workspace = true }
xmlcraft-editor = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# egui 0.37 has no default fonts unless asked; the widget tests and the screenshot example lay text out with them.
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = { workspace = true, features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
