[package]
name = "xmlcraft-query"
description = "XmlCraft's XPath evaluation over documents, with results that say where they are in the text"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xmlcraft-syntax = { workspace = true }
xee-xpath = "0.1.5"
xee-xpath-compiler = "0.1.5"
xot = "0.31"
rowan = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# The engine's hash maps want random seeds; on the web they come from the browser (getrandom needs the `wasm_js` backend, chosen in
# `.cargo/config.toml`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
