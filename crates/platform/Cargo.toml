[package]
name = "xmlcraft-platform"
description = "XmlCraft's native services: reading and atomically writing files, and noticing that a file changed on disk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
xmlcraft-engine = { workspace = true }
xmlcraft-dtd = { workspace = true }
xmlcraft-text = { workspace = true }

# The file functions are native only (on the web they are stubs, see files.rs): the web build does not resolve the atomic-write crate.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }

[dev-dependencies]
tempfile = "3"
