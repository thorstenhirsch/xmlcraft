notes = "`.yaml` and `.yml` documents are read by YAML 1.2 rules (`saphyr-parser`; aliases expanded under a bound, merge keys applied, core-schema scalars), with problems at their places, coloured (keys, strings, numbers, keywords, anchors and aliases, comments; block scalars and quoted scalars that go over lines), outlined (keys and the entries of lists that are containers, with a look at scalar values; a stream of documents has an item each) and folded (blocks and multi-line scalars). Nothing is typed for you and nothing is reformatted: YAML's white space is its structure. The tools xml_wellformed, xml_outline and xml_folds read it (`language` yaml for text). Completion and hover from a JSON Schema (block and flow style) are `json.completion`, and validation against one is `json.yaml-validate`. Still missing: formatting that keeps comments, key sorting."

