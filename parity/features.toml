evidence = ["crates/infer/tests/infer.rs::a_small_document_gives_the_schema_it_looks_like", "crates/infer/tests/infer.rs::the_same_document_in_the_other_layouts", "crates/infer/tests/infer.rs::an_inferred_xsd_validates_its_sources", "crates/automation/tests/infer.rs::what_is_generated_validates_its_source_through_the_other_tool", "crates/ui-egui/tests/generate.rs::generate_schema_makes_a_new_document_from_the_one_being_shown", "crates/ui-egui/tests/generate.rs::the_options_of_the_form_are_the_options_of_the_schema"]
notes = "An XML Schema from one or more documents (`xmlcraft-infer`), in three layouts (Russian doll, Salami slice, Venetian blind) and one schema document per namespace, with imports. The content model of an element is a sequence of repeated choices learned from the order and number of its children (deterministic by construction: every name is in one place; mixed content is a repeated choice), attributes are required when every element has them, `xml:` attributes are referred to through `xml.xsd`, and a schema inferred from documents validates each of them (property test, 1500 cases, every layout and every option set). In the app, Generate Schema… (XML menu) asks for the kind (XML Schema or DTD), the layout, type detection, the enumeration rule, unbounded occurrences, and which of the open documents to learn from; the work is done on a worker thread and each file of the result is a new document (`schema.xsd`, `schema.dtd`, one per namespace). Also the tool `xml_infer` and `xmlcraft-cli infer`. Missing: assigning the result to the source document (Assign Schema is not there yet), and writing the files to a folder from the dialog (they are new documents to save). Not inferred: keys and keyrefs, `xs:all`, derived types, patterns and length facets, `xsi:type`."

