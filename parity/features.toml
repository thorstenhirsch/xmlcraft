notes = "F8 on an XML Schema checks the schema itself: `xmlcraft_engine::validation::check_schema` reads it with the resolver (the documents that are open as they are edited, the schemas that ship with the app, catalogs, files, and in the window the network unless the app works offline), follows its includes and imports and assembles its components, so a type or group it names that is not defined, a derivation that is not allowed and a representation constraint become problems. A problem in an included or imported document names that file and its line. A schema that is not well-formed is not assembled; its syntax problems are the answer (in the window they are the ones the analysis lists). Validate While Typing checks a well-formed schema after the same pause as a document, without a word in the status bar. Headless: `schema_check` (an open document, a path or text; offline unless the session is given a network). Missing: XSD 1.1, `xs:redefine` read but not applied (as in `validate.xsd`), a quick fix for what is found (M3.16)."

