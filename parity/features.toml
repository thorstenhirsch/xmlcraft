notes = "Parameter entities are expanded as XML 1.0 4.4 says: between declarations everywhere, inside declarations and entity values of the external subset (with the spaces the spec adds), external ones through the loader (read once, text declaration checked and removed), the internal-subset rule (no reference inside a declaration), recursion, undeclared references (an error without an external part, a note with one) a construct that begins in a parameter entity between declarations and ends outside it, and limits (nesting 40, 10 million bytes, 256 loads). Problems are listed up to 1000, then one note says there are more. Missing: validity constraints about nesting of declarations and groups with parameter entities, external ones are loaded through the loader the caller gives (the app and the tools give the resolver's: `ResolvingSubsetLoader`)."

