evidence = ["crates/json/tests/assist.rs::the_names_of_an_object_come_with_what_is_required_first_and_what_is_present_left_out", "crates/json/tests/assist.rs::a_reference_is_followed_into_the_members_of_a_member", "crates/json/tests/assist.rs::alternatives_are_all_offered_and_combined_schemas_are_merged", "crates/json/tests/assist.rs::a_schema_that_refers_to_itself_ends", "crates/engine/src/json_assist.rs::names_are_offered_required_first_without_those_present_and_replace_what_is_typed", "crates/engine/src/json_assist.rs::yaml_offers_names_and_values_by_indentation", "crates/engine/src/json_assist.rs::hover_says_what_the_schema_says_of_a_name_or_a_value", "crates/engine/src/json_assist.rs::no_caret_in_any_text_makes_it_panic", "crates/automation/tests/json_assist.rs::names_and_values_come_from_the_schema_the_document_names_even_while_it_is_being_typed", "crates/automation/tests/json_assist.rs::hover_says_what_the_schema_says_and_yaml_works_with_the_modeline", "crates/ui-egui/tests/data_assist.rs::a_name_being_typed_in_json_is_completed_with_the_value_its_type_needs", "crates/ui-egui/tests/data_assist.rs::a_value_being_typed_is_completed_from_the_enum_and_a_line_break_is_not_taken_by_an_empty_popup", "crates/ui-egui/tests/data_assist.rs::yaml_is_completed_by_indentation_from_the_schema_of_its_modeline", "crates/engine/src/json_schemas.rs::a_schema_among_the_open_documents_is_loaded_as_it_is_being_edited_and_a_missing_one_says_so", "crates/engine/src/json_assist.rs::bson_extended_json_is_completed_and_hovered_as_json_one_document_or_one_to_a_line", "crates/automation/tests/json_assist.rs::a_bson_file_is_completed_and_hovered_in_its_extended_json_text", "crates/ui-egui/tests/bson.rs::the_json_schema_a_bson_document_names_completes_its_names", "crates/engine/src/yaml_assist.rs::a_flow_collection_opened_on_an_earlier_line_is_read_too", "crates/engine/src/yaml_assist.rs::a_quoted_name_in_a_flow_mapping_is_the_name_without_its_quotes", "crates/ui-egui/tests/data_assist.rs::yaml_flow_mappings_are_completed_too", "crates/ui-egui/tests/data_assist.rs::yaml_flow_mappings_are_completed_on_the_lines_after_they_open", "crates/automation/tests/json_assist.rs::an_object_or_an_array_the_schema_offers_no_value_for_is_offered_as_an_empty_shape", "crates/ui-egui/tests/data_assist.rs::an_object_or_an_array_with_no_value_is_completed_as_an_empty_shape"]
notes = "`SchemaSet::properties_at`, `values_at` and `describe_at` (xmlcraft-json) say what the schemas that apply at a place allow: the names the object declares (the required ones first, without those it already has), the values of enum and const, true and false, null, the default and the examples, and the title, description, types and deprecation, following $ref, allOf, anyOf, oneOf, then and else, patternProperties, additionalProperties, items and prefixItems; conditions are not evaluated, so every alternative is offered. `xmlcraft_engine::json_assist::complete` and `hover` find the place from the text before the caret (a scanner that follows brackets, names and commas, so a document that is being typed works; JSON, JSONC, JSON5 and JSON Lines) or, for YAML, from the indentation, list dashes and keys above it (block style), read the schema the document names (`$schema`, or the yaml-language-server modeline) through the resolver, and give the text to put in with the caret position and the part to replace. The tools `json_complete` and `json_hover` do the same headlessly. In the window the schema the document names is loaded on a worker thread when what it names (or an open document that may be the schema) changes; while a name or value is being typed (a string or a word) the popup under the caret offers the names (with their type and `required`) or values, Enter or Tab writes the choice as one undoable step, replacing what was typed, and the tip where the pointer rests adds the schema's title, description, types, values and default to the problems there. Edit ▸ Complete (⌘I, Ctrl+I) opens the popup where nothing has been typed yet (between names, after a colon) and says so when there is nothing to offer. A BSON file is completed and hovered in its Extended JSON text from the `$schema` of its first document (one document, or one to a line; M5.17). YAML flow collections (`{…}` and `[…]`, also opened on an earlier line) are completed and hovered too; inside a block scalar nothing is offered (M5.18). A value the schema types as an object or an array is offered as `{}` or `[]` with the caret inside (M5.19). Missing: the schema's description beside the choice, the header pill still says \"No schema\" for these documents, multi-line flow scalars, the Extended JSON wrappers (`$oid`, `$date`) as values, evaluating `if`, the dependent keywords, snippets that fill an object's required names, the SchemaStore catalog to find a schema by file name, completion in a schema being written (its keywords)."

