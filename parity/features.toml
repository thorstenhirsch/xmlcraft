notes = "`xmlcraft-openapi` reads OpenAPI 2.0, 3.0, 3.1 and 3.2 descriptions in JSON or YAML into servers (variables resolved; for 2.0 from host, basePath and schemes) and operations with their parameters (path, query, header, cookie; shared and own, local $refs followed) and request bodies per media type, makes example values from JSON Schemas (example, default, const, first enum value, required and optional properties, an array item, the first of oneOf or anyOf, allOf merged, formats, 3.1 type lists; a recursive schema is cut) and builds the HTTP request (path parameters filled in and percent-encoded, query, headers, body, Content-Type; what is required and missing is an error). The tools `openapi_describe`, `openapi_request` and `openapi_call` (sends it with the HTTP client of the SOAP call: no redirects, private hosts refused unless allowed, only when a person allowed the network; the JSON answer is read) use it. XML ▸ Send OpenAPI Request… is the window: it lists the operations (and, with more than one, the servers) of the JSON or YAML description being shown, makes the request with example values, lets the method, address, headers and body be edited, sends it on Send (the same rules as the SOAP window: refused offline, local hosts only with the box ticked, no redirects) and shows the status, headers and body of the answer; the request and the answer open as documents. Missing: editing the parameters one by one (the address and headers are edited as text), authentication schemes and security requirements, cookie parameters in the request, parameter styles beyond the default, form and multipart bodies, response validation, remote $refs, a history."

