title = "Validate JSON against JSON Schema (drafts 04, 06, 07, 2019-09 and 2020-12)"
area = "I"
tier = "P1"
milestone = "M5"
status = "partial"
commands = ["xml.validate"]
tools = ["json_validate"]
evidence = ["crates/json/tests/validate.rs::references_are_followed_within_a_document_and_to_other_documents", "crates/json/tests/validate.rs::what_nothing_else_evaluated_is_unevaluated", "crates/automation/tests/json_schema.rs::violations_are_listed_with_their_place_in_the_text", "crates/engine/src/json_validation.rs::a_json_document_is_checked_against_the_schema_it_names_and_each_problem_is_where_it_is", "crates/ui-egui/tests/json.rs::f8_checks_a_json_document_against_the_schema_it_names_and_lists_what_is_wrong", "crates/engine/src/json_validation.rs::a_document_that_names_a_draft_is_a_schema_and_is_checked_against_the_meta_schema_of_that_draft", "crates/engine/src/assign.rs::a_json_object_gets_a_schema_member_written_to_match_its_lines", "crates/engine/src/assign.rs::yaml_gets_a_modeline_on_its_first_line_or_has_its_own_replaced", "crates/ui-egui/tests/assign.rs::a_json_schema_is_assigned_to_json_and_yaml_documents_and_then_f8_checks_the_document_against_it", "crates/automation/tests/assign.rs::a_json_schema_is_assigned_to_json_and_yaml_documents_as_a_member_and_a_modeline", "crates/ui-egui/tests/validation.rs::a_json_or_yaml_document_that_names_a_schema_is_validated_when_it_is_left_alone_and_one_that_names_none_is_not"]
notes = "Assign Schema… (the header pill, the XML menu, `xml_assign_schema`) names a JSON Schema in a JSON or YAML document as a minimal edit that can be undone: a root `$schema` member (replaced when there is one; written to match the lines around it, the indentation and line ending of the document kept; JSONC and JSON5 comments untouched) or the first-line `# yaml-language-server: $schema=` modeline (replaced when there is one); JSON Lines, BSON and a root that is not an object are refused with the reason. `xmlcraft-json` validates against drafts 04, 06, 07, 2019-09 and 2020-12 (the draft from `$schema`): all the validation and applicator keywords, `$ref`/`$recursiveRef`/`$dynamicRef` with their scopes, `unevaluatedProperties` and `unevaluatedItems`, exact numbers, and every violation placed in the text of the instance. Headless: the tool `json_validate` (the schema as a file, as text or the file the document names; referred schemas are files next to it, through the root confinement). The JSON Schema Test Suite (required tests, drafts 4 to 2020-12) is the measure: 99.96% (4948 of 4950), ratcheted by `cargo xtask conformance jsonschema`. In the window (and headless for YAML, see `json.yaml-validate`) F8 does the checking. Missing: `format` assertions, vocabularies, look-around in patterns. F8 (Validate) on a JSON, JSONC, JSON5 or JSON Lines document that names a schema with `$schema` (a path or URI relative to the file; a `$schema` that names a draft is not a schema to check against) reads the schema (and the documents it refers to) through the resolver, the open documents first, and lists each violation in Problems at its place in the text (a member at its name). Typing: a document that names a schema (and is well-formed) is validated after the same pause as XML, with the result underlined and in Problems, as with F8 (M5.14). Not yet: SchemaStore (finding a schema by file name), BSON instances. A document that names a draft with `$schema` is a schema and is checked against the bundled meta-schema of the draft (M5.10). A document that names a draft of JSON Schema with `$schema` is itself checked against the bundled meta-schema of that draft."

