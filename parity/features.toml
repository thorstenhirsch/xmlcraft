evidence = ["crates/ui-egui/tests/entry_helpers.rs::escape_clears_the_filter", "crates/ui-egui/tests/entry_helpers.rs::what_was_typed_in_the_filter_is_gone_after_the_insert", "crates/ui-egui/tests/entry_helpers.rs::a_double_click_clears_the_filter_too", "crates/ui-egui/tests/entry_helpers.rs::the_arrow_keys_choose_and_enter_inserts_the_chosen_one", "crates/ui-egui/tests/entry_helpers.rs::the_filter_narrows_what_is_offered_and_says_when_nothing_matches", "crates/ui-egui/tests/entry_helpers.rs::go_to_entry_helpers_opens_the_pane_and_puts_the_keyboard_in_the_filter", "crates/ui-egui/tests/entry_helpers.rs::a_double_click_puts_an_element_with_what_it_requires_and_undo_takes_it_back", "crates/ui-egui/tests/entry_helpers.rs::the_elements_the_content_model_allows_here_are_listed_with_the_required_ones_marked", "crates/ui-egui/tests/entry_helpers.rs::attributes_of_the_element_are_offered_and_added_to_its_start_tag", "crates/ui-egui/tests/entry_helpers.rs::the_option_decides_whether_the_children_a_declaration_requires_are_put_too", "crates/ui-egui/tests/entry_helpers.rs::an_entity_is_put_as_a_reference", "crates/complete/tests/choices.rs::the_text_for_an_element_has_what_its_declaration_requires", "crates/automation/tests/entry_helpers.rs::the_attributes_of_the_start_tag_say_which_are_given_and_where_a_new_one_goes", "crates/complete/tests/xsd.rs::the_content_model_of_the_type_is_followed_through_the_children_before_the_position", "crates/complete/tests/xsd.rs::the_attributes_of_the_type_say_which_are_required_used_and_what_values_they_take", "crates/complete/tests/xsd.rs::the_children_an_element_must_have_are_written_in_it_and_in_them", "crates/complete/tests/xsd.rs::names_are_written_as_the_document_writes_them", "crates/automation/tests/entry_helpers.rs::a_document_that_names_a_schema_is_answered_from_it", "crates/automation/tests/entry_helpers.rs::a_schema_being_edited_is_what_the_answer_comes_from", "crates/ui-egui/tests/entry_helpers.rs::a_double_click_puts_the_element_with_what_the_schema_requires_and_undo_takes_it_back", "crates/ui-egui/tests/entry_helpers.rs::the_values_of_the_type_of_an_element_are_listed_and_put_as_text", "crates/ui-egui/tests/entry_helpers.rs::a_schema_that_is_open_and_edited_is_what_the_choices_come_from"]
notes = "From the DTD of the DOCTYPE (the internal subset and the external parts: files, open documents, the DTDs that ship with the app by their public identifier, such as XHTML 1.0), or, when there is no DOCTYPE, from the XML Schema the document names with `xsi:schemaLocation` or `xsi:noNamespaceSchemaLocation`: the pane lists the elements the content model of the enclosing element allows after the children before the caret (required ones marked, EMPTY ones shown), the attributes of the element the caret is in (required marked, those the start tag has greyed, the values an enumeration lists, a default or fixed value first) and the entities that can be referred to (a DTD); with a schema also the values the text of the element may have (an enumeration, a boolean, the members of a union). A double click puts the choice in the text as one undoable step: an element with the attributes it requires and, with \"Insert required content\" (on by default), the children it requires and theirs (to a depth of 6 and 16 KiB; a fixed value as the content), the caret in the first value to fill in; an attribute goes at the end of the start tag with the first value of an enumeration; a value or an entity as text or a reference; a selection is replaced. With a schema the element at the caret is typed by walking down from the root (each child by the content model of its parent after its siblings; substitution groups, wildcards and `xsi:type` followed), names are written as the document writes them (the prefix a namespace has there, else the declaration it needs, `xmlns=\"\"` for an unqualified local element under a default namespace). The DTD is read on a worker when the DOCTYPE or the file's place changes; the schema on a worker when the schemas named, the place of the document or another open document changes (a schema being edited is used as it is). Headless: the tool `xml_entry_helpers` (`kind` says which). Missing: the completion popup in the editor (M1.10d), the list checks only what comes before the caret, not what the content model needs after it, a DTD or schema file that changes on disk is not read again until the DOCTYPE or an open document changes, wildcards offer no names, abstract types are not resolved to their members, elements and attributes of the schema's `xs:redefine` are not applied, no Info pane beside the choices (documentation of the declaration), and the option is not in Preferences. By keyboard (M2.11): View ▸ Go to Entry Helpers (⇧⌘E / Ctrl+Shift+E) opens the pane and puts the keyboard in its filter; typing narrows every list (a name containing the text, any case), the arrow keys choose a row (wrapping), Enter inserts it and clears the filter, Escape clears the filter and returns to the text."

