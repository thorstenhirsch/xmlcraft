notes = "The files, the catalogs that lead to them and the packing exist: `crates/schemas` embeds `schemas/` (deflated, read one file at a time), `schemas/manifest.toml` pins each file to its URL and SHA-256, and `cargo xtask schemas` (in ci) checks the hashes, the closed licence list, that no schema file is unlisted, that ATTRIBUTION.toml is the one the manifest makes, that every catalog entry leads to a bundled file, and the 250-file cap. The resolver reads it (M2.3) and the app, the tools and Entry Helpers use it, so these validate offline. In the bundle (143 files in four sets): 100 W3C files (the XML Schema schema, DTD and datatypes DTD, xml.xsd, XHTML 1.0 (the three DTDs and their entity sets) and XHTML 1.1 (the modular DTD, its 40 modules and entity sets), SVG 1.1 (the DTD and its 30 modules), MathML 3 (the schema and its four parts), XLink, XML Signature, SOAP 1.2 and WSDL 2.0), 15 UBL, 18 JSON Schema and 10 OpenAPI files. A document of the XHTML 1.1 and SVG 1.1 DTDs is validated against them end to end (the modular parameter entities, the conditional sections), and the global elements of every bundled schema give a valid sample document (except SOAP's `Fault`, whose code is an enumeration of QNames). Missing: the sets that need the owner's decision (MathML 2 and DocBook 4.5 need ISO's entity sets, which carry ISO's own notice, \"permission to copy in any form for use with conforming SGML systems\"; the XSLT 2.0 schema cites the 1998 W3C Software License, not the 2015 one on the allowlist), OASIS sets (DocBook, SAML, XLIFF, UBL, DITA, OpenDocument), the other W3C sets (SMIL, VoiceXML, SSML, XForms, RDF/XML, SKOS) and the ~150-file set of M4.7. The schema browser and assigning a bundled schema are catalog.schema-browser."

