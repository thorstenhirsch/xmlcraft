notes = "M2.4: `xmlcraft_platform::disk_cache::DiskCache` keeps one file per URL (named by the SHA-256 of the URL) in the system's cache folder (`~/Library/Caches/XmlCraft/schemas`, `%LOCALAPPDATA%\\XmlCraft\\Cache\\schemas`, `$XDG_CACHE_HOME/xmlcraft/schemas`; `XMLCRAFT_CACHE_DIR` names another): where the copy came from, its ETag and Last-Modified, and the body, written atomically; a file that is too large, cut short, malformed or for another URL is a miss, never an error; up to 256 MiB, the copies fetched longest ago go first. The rules of `xmlcraft-resolve` apply: current for 30 days, then asked about with the ETag / Last-Modified, renewed on *not modified*, replaced on a new body, kept and marked stale when the server cannot be reached (tested over loopback against the real client). Missing: a setting for its size (Edit ▸ Preferences… can clear it), nothing is kept for a resource that was refused, and the cache holds the text, not the parsed schema (every validation reads it again). Edit ▸ Preferences… says how many files and how much the cache holds and has Clear Cache (the documents ask again for what they need)."

