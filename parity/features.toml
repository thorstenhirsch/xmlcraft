# XmlCraft parity checklist vs the leading commercial XML editors (the desktop editing feature set). Maintained by hand.
# Validated and reported by `cargo xtask parity`. Schema: see the [schema] table.
# Status rules: `shipped` = usable today with at least one cited test; `partial` = part exists (notes say what is
# missing); `planned` = not started; `na` = out of scope (notes name the alternative, if any). `na` entries are excluded
# from every percentage.
# Tiers: P0 = needed for the 0.1.0 MVP; P1 = important, soon after; P2 = valuable; P3 = long tail.
# `commands` lists registry ids from crates/engine/src/commands.rs only; `tools` lists crates/automation/src/tools.rs names.
# `evidence` lists `path.rs::test_fn` entries that must exist. Milestones are those of docs/roadmap.md (M0-M10, or none).
[schema]
version = 1
statuses = ["planned", "partial", "shipped", "na"]
tiers = ["P0", "P1", "P2", "P3", "N/A"]
areas = { A = "editor", B = "views", C = "dtd", D = "xsd", E = "validation", F = "generators", G = "catalogs", H = "query", I = "json", J = "project", K = "app" }


# ==================================================================================================
# A. editor
# ==================================================================================================

[[feature]]
id = "editor.syntax-highlighting"
title = "Syntax colouring for XML, XSD, DTD and entity files"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = []
tools = []
evidence = ["crates/syntax/src/highlight.rs::line_by_line_equals_the_whole_text", "crates/ui-egui/src/editor_view.rs::every_class_that_is_read_has_enough_contrast_in_both_themes"]
notes = "XML (so XSD and every other XML file) and a DOCTYPE with its internal subset are coloured line by line from the lexer's mode, in light and dark palettes checked for contrast. Not yet: .dtd, .ent and .mod files as DTD (needs file-type detection), refinements from the syntax tree, JSON and YAML."

