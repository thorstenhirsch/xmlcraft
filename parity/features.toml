tools = ["soap_sample", "soap_call"]
evidence = ["crates/wsdl/tests/wsdl.rs::a_request_has_an_envelope_a_sample_body_and_the_headers_of_its_soap_version", "crates/wsdl/tests/wsdl.rs::rpc_style_wraps_the_parts_in_an_element_named_for_the_operation", "crates/automation/tests/wsdl.rs::a_request_is_made_with_schemas_imported_by_location_from_beside_the_wsdl", "crates/automation/tests/wsdl.rs::a_call_sends_the_envelope_with_the_headers_of_its_version_and_reads_a_fault_from_the_answer", "crates/platform/src/client.rs::a_post_is_sent_with_its_headers_and_body_and_the_whole_answer_comes_back", "crates/wsdl/tests/wsdl.rs::a_response_is_read_with_its_version_headers_and_body_and_a_fault_with_its_code_reason_and_detail", "crates/engine/src/soap.rs::an_operation_bound_twice_is_listed_once_for_each_soap_version", "crates/engine/src/soap.rs::a_request_has_the_address_the_headers_and_an_envelope_of_the_bindings_version", "crates/ui-egui/tests/soap.rs::the_request_made_for_an_operation_is_sent_where_the_person_allows_and_the_answer_is_read", "crates/ui-egui/tests/soap.rs::nothing_is_sent_while_the_app_works_offline"]
notes = "`Wsdl::sample_request` and the tool `soap_sample` make the request of an operation: a SOAP 1.1 or 1.2 envelope (as the binding says) with a body sampled from the schema of the input (document style) or the operation element with a part each (rpc style), the headers (Content-Type, SOAPAction or the action parameter) and the endpoint address; schemas imported by location are read from beside the WSDL. The tool `soap_call` sends it (an HTTP client in `xmlcraft-platform`: any method, headers and body, no redirects followed, a host on this computer or the local network refused unless the call allows it, the answer capped) and reads the answer: the HTTP response, and when the body is a SOAP message its version, header blocks, body and fault (code, subcode, reason, actor, detail; a 1.1 fault with HTTP 500 is an answer). XML ▸ Send SOAP Request… is the window: it lists the operations of the WSDL being shown (once for each SOAP binding), makes the request on a thread, lets the address, the headers and the envelope be edited, sends it when Send is pressed (refused while the app works offline; a host on this computer or the local network needs the box ticked; no redirects) and shows the status, the SOAP version, a fault's code and reason, the headers and the body of the answer, with the request and the answer openable as documents. Missing: validation of the response against the schema, SOAP headers (WS-Security, WS-Addressing), attachments (MTOM), keeping a history of calls, authentication helpers, the window's own syntax colouring of the envelope."

[[feature]]
id = "soap.debugger"
title = "SOAP debugger: an intercepting proxy with breakpoints per operation, conditions, edit and forward"
area = "E"
tier = "P2"
milestone = "M8"
status = "partial"
commands = ["xml.soap_debugger"]
tools = ["soap_proxy_start", "soap_proxy_state", "soap_proxy_breaks", "soap_proxy_release", "soap_proxy_drop", "soap_proxy_stop"]
evidence = ["crates/platform/src/proxy.rs::a_request_is_forwarded_to_the_target_and_the_answer_comes_back_and_both_are_recorded", "crates/platform/src/proxy.rs::a_held_request_waits_for_a_person_and_goes_on_as_edited", "crates/platform/src/proxy.rs::a_dropped_request_never_reaches_the_target_and_a_held_answer_can_be_edited", "crates/platform/src/proxy.rs::what_is_not_an_http_request_or_is_too_large_is_refused_and_a_dead_target_is_a_bad_gateway", "crates/platform/src/proxy.rs::a_chunked_request_body_is_decoded_and_stop_frees_what_is_held", "crates/ui-egui/tests/soap_debugger.rs::a_request_comes_through_the_proxy_and_is_listed_with_its_path_and_stage", "crates/ui-egui/tests/soap_debugger.rs::a_held_request_is_released_from_the_window_and_only_then_reaches_the_target", "crates/automation/tests/soap_proxy.rs::a_request_is_forwarded_recorded_held_and_released_edited", "crates/automation/tests/soap_proxy.rs::a_dropped_request_never_reaches_the_target_and_the_refusals_are_said"]
notes = "XML ▸ SOAP Debugger… and the tools `soap_proxy_*` run an intercepting proxy: it listens on this computer only (127.0.0.1), is started by a person (Start, or soap_proxy_start; the session's network must be allowed) and stops with the window (or soap_proxy_stop), forwards every request to one target through the same client as the SOAP window (no redirects, private targets only when allowed, answers capped) and records each request and answer. With Hold requests or Hold answers on (optionally only messages whose body contains a text) a message waits until it is released, as it was or edited (headers and body), or dropped (the client gets 502; a dropped request never reaches the target). The client talks plain HTTP/1.1 to it (Content-Length or chunked bodies, one request to a connection). Missing: conditions as XPath on the SOAP body and breakpoints per operation (only a text the body contains), TLS from the client to the proxy, keep-alive, WebSocket, a saved history of exchanges, and the profiling views of the real tool."

[[feature]]
id = "xbrl.instance-validation"
title = "XBRL 2.1 instance validation"
area = "E"
tier = "P2"
milestone = "M9"
status = "partial"
commands = ["xml.validate"]
tools = ["xbrl_facts"]
evidence = ["crates/xbrl/tests/xbrl.rs::contexts_units_and_facts_are_read_with_their_places_and_dimensions", "crates/xbrl/tests/xbrl.rs::what_the_instance_says_wrong_about_itself_is_found_at_the_fact_or_context", "crates/xbrl/tests/xbrl.rs::periods_duplicates_and_what_is_never_used", "crates/engine/src/validation.rs::an_xbrl_instance_is_checked_for_what_it_says_of_itself_and_is_not_blamed_for_having_no_doctype", "crates/automation/tests/xbrl.rs::facts_contexts_units_and_findings_are_listed_with_places", "crates/engine/src/business.rs::an_xbrl_instance_says_how_many_facts_it_has_and_warns_of_errors"]
notes = "`xmlcraft-xbrl` reads an XBRL 2.1 instance into contexts (entity identifier and scheme, instant, duration or forever, explicit and typed dimension members of segment and scenario), units (measures, divide) and facts (concept, value, contextRef, unitRef, decimals, precision, nil, id, place in the text) and checks what the specification says of the instance itself: a fact whose contextRef or unitRef names nothing or is missing, duplicate context and unit ids, a period that is no date or ends before it starts, an entity with no scheme, decimals with precision, decimals or precision that is not an integer or INF, a nil fact with a value, a number that is not one, duplicate and inconsistent facts, contexts and units never used, a missing schemaRef. F8 lists the findings in Problems at their fact or context (and an XBRL instance is not blamed for naming no DOCTYPE); the tool `xbrl_facts` lists the facts, contexts, units and findings. Missing: everything that needs the taxonomy (is the concept numeric, its period type, its balance, the calculation relationships, the dimensional validation of members and hypercubes), schemaRef resolution, the XBRL conformance suite, a facts table in the window. The header names an instance in a chip with its number of facts (and of errors)."

[[feature]]
id = "xbrl.taxonomy"
title = "XBRL taxonomy discovery, linkbases and validation, taxonomy packages"
area = "E"
tier = "P2"
milestone = "M9"
status = "partial"
commands = ["xml.validate"]
tools = ["xbrl_facts"]
evidence = ["crates/xbrl/tests/taxonomy.rs::the_concepts_of_the_schemas_an_instance_names_and_what_they_import_are_read_with_their_types", "crates/xbrl/tests/taxonomy.rs::a_correct_instance_has_nothing_to_say_and_each_mistake_is_its_own_finding", "crates/xbrl/tests/taxonomy.rs::what_cannot_be_read_of_the_taxonomy_is_a_warning_and_what_it_does_not_cover_is_not_judged", "crates/engine/src/validation.rs::the_facts_of_an_instance_are_checked_against_the_taxonomy_among_the_open_documents", "crates/automation/tests/xbrl.rs::the_taxonomy_a_schema_ref_names_is_read_from_beside_the_instance_and_its_findings_are_listed", "crates/xbrl/tests/calculation.rs::weights_rounding_and_decimals_follow_the_specification", "crates/xbrl/tests/calculation.rs::only_facts_equal_in_context_and_unit_by_value_contribute_and_some_calculations_do_not_bind", "crates/automation/tests/xbrl.rs::a_calculation_linkbase_beside_the_schema_is_used_to_check_the_sums"]
notes = "The taxonomy an instance names is read: its `schemaRef`s (and the `xs:import` and `xs:include` of what they load, once each, at most 500 documents and 64 MB) through the resolver (the open documents, files inside the root, the catalogs, the bundle, the web where the app may), into concepts (name, type, substitution group, period type, abstract) and the types derived from the XBRL item types. F8 and `xbrl_facts` then find in the facts what the instance alone cannot say: a concept the taxonomy does not declare, an abstract concept with a fact, a number with no unitRef (or a unit on what is not a number), a number with neither decimals nor precision, an instant concept in a duration context (or the other way round); a taxonomy document that could not be read is a warning, and a namespace no document read declares is said once and not judged. Calculation linkbases (the ones the schemas name with a `linkbaseRef` and the ones embedded in an `appinfo`) are read and the summation-item relationships are checked as XBRL 2.1 5.2.5.2 says: facts that are equal in context and unit by value, each rounded to its decimals (or the decimals its precision comes to) with ties to even, times the weight, the total rounded to the decimals of the summation item; a precision of 0 is inconsistent, and nil facts, duplicates and a summation item without contributors do not bind; a prohibiting arc of a priority at least as high drops a relationship. An inconsistency is a warning at the summation item (`xbrl.calculation-inconsistent`). Missing: the other linkbases (labels, presentation, definition, formula), calculation scoping inside tuples, the XBRL conformance suite, taxonomy packages, dimensions (hypercubes, domain-member checks), fractions and tuples (a tuple concept is skipped), balance checks, the facts window, and reading a taxonomy from a remote location is only as good as the app's network setting."

