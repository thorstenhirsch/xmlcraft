[[feature]]
id = "editor.multi-cursor"
title = "Multiple cursors (click, next occurrence)"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = ["edit.select_next_occurrence", "edit.select_all_occurrences"]
tools = []
evidence = ["crates/editor/tests/model.rs::typing_matches_a_hand_rebuilt_string", "crates/editor/src/find.rs::the_next_occurrence_is_added_one_at_a_time", "crates/ui-egui/tests/find.rs::control_d_adds_the_next_occurrence_and_typing_changes_all_of_them"]
notes = "Every command works on several carets; a command-click adds one; ⌘D (Ctrl+D) selects the word and then adds the next occurrence, ⇧⌘L (Ctrl+Shift+L) a caret on every occurrence (or every match of the find bar), and Find can select all matches. Alt-drag is column selection, a feature of its own. Not yet: a headless tool for the two occurrence commands (they are registry commands only), and the gestures' tests in the widget."

[[feature]]
id = "editor.column-selection"
title = "Column (rectangular) selection"
area = "A"
tier = "P1"
milestone = "M1"
status = "partial"
commands = []
tools = ["doc_select"]
evidence = ["crates/editor/src/columns.rs::a_rectangle_is_one_selection_per_line_and_short_lines_are_cut_at_their_end", "crates/editor/src/columns.rs::dragging_to_the_left_selects_backwards_and_upwards_makes_the_first_line_the_primary", "crates/editor/src/columns.rs::typing_replaces_every_line_of_the_rectangle_in_one_undo_step", "crates/editor/src/columns.rs::lines_hidden_by_a_fold_are_left_out_and_the_number_of_lines_is_capped", "crates/code-editor/tests/widget.rs::dragging_with_alt_selects_a_rectangle_and_typing_edits_every_line_of_it", "crates/automation/tests/documents.rs::comments_and_selections_work_on_the_structure"]
notes = "An Alt-drag (Option on macOS) selects a rectangle: a selection on every line between the two corners, from the display column of one to the display column of the other (a tab is as wide as it is drawn; a shorter line gets a caret at its end; lines hidden by a fold are left out; at most 20,000 lines), the head's line is the primary caret, and typing, deleting and pasting then edit every line as one undo step. Headless: doc_select with columns. Missing: keyboard extension of the rectangle (Shift+Alt+arrows), the rectangle following the text as it changes, and Alt-drag where the window manager takes it (Linux: use the tool or the multi-caret commands)."

[[feature]]
id = "editor.find-replace"
title = "Find and replace with regex, case, whole word and in-selection"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = ["edit.find", "edit.replace", "edit.find_next", "edit.find_previous"]
tools = ["doc_find", "doc_replace"]
evidence = ["crates/editor/src/find.rs::literal_search_agrees_with_the_standard_library", "crates/editor/src/find.rs::replacing_one_at_a_time_then_all", "crates/ui-egui/tests/find.rs::the_find_bar_finds_counts_and_steps_through_matches", "crates/ui-egui/tests/find.rs::replace_one_and_replace_all", "crates/automation/tests/documents.rs::finding_and_replacing_text_and_patterns"]
notes = "⌘F opens a bar above the editor: text or a regular expression (groups in the replacement as $1), match case, whole word, a counter, next and previous (Enter, F3), Replace and Replace All (one undo step), every match highlighted in the text (up to 10,000 matches, in documents up to 4 MB; a match across lines is highlighted on each of its lines; above 4 MB the bar does not count, and the matches on each line drawn are highlighted, except a match across lines and any on a line longer than 64 KB), and `doc_find` / `doc_replace` headlessly. Replace All refuses more than 10,000 matches or 16 MiB of replacement text, and says so. Still missing: searching only the selection from the bar (the engine can), find history, a replace preview, and find in files (M10)."

[[feature]]
id = "editor.find-in-files"
title = "Find and replace across files and folders"
area = "A"
tier = "P1"
milestone = "M10"
status = "partial"
commands = ["edit.find_in_files"]
tools = ["files_find"]
evidence = ["crates/platform/src/search.rs::a_folder_is_searched_by_file_name_pattern_and_what_is_not_text_is_skipped", "crates/automation/tests/files_find.rs::a_folder_is_searched_with_the_editors_matcher_and_a_name_pattern", "crates/ui-egui/tests/find_files.rs::the_hits_in_a_folder_are_listed_and_a_click_opens_the_file_at_the_line"]
notes = "Find in Files (Shift+Cmd+F): a text or regular expression (case, whole word) looked for with the editor's matcher in the files under a folder whose names fit `*.xml;*.xsd`-style patterns; the hits are listed by file with line and column, and a click opens the file at the line. Dot folders, node_modules and target are skipped, links are not followed, files that are not text are skipped, and files, hits and line lengths are capped. Missing: replace across files, a folder chooser panel (the folder is typed), searching open unsaved documents, an include/exclude list, results kept in a panel instead of a window."

[[feature]]
id = "editor.code-folding"
title = "Folding of elements, comments, CDATA and DOCTYPE; fold all and to level"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = ["edit.fold", "edit.unfold", "edit.fold_all", "edit.unfold_all", "edit.fold_level_1", "edit.fold_level_2", "edit.fold_level_3"]
tools = ["xml_folds", "doc_fold"]
evidence = ["crates/engine/src/folding.rs::an_element_with_content_on_lines_of_its_own_folds_down_to_its_end_tag", "crates/engine/src/folding.rs::fold_and_unfold_work_on_the_innermost_range_at_the_caret", "crates/editor/src/folds.rs::the_caret_moves_over_a_fold_not_into_it", "crates/editor/src/folds.rs::the_map_agrees_with_a_list_of_the_visible_lines", "crates/code-editor/tests/widget.rs::hidden_lines_have_no_row_and_a_click_goes_to_the_line_on_the_row", "crates/ui-egui/tests/folding.rs::the_fold_commands_fold_and_unfold_what_the_caret_is_in", "crates/automation/tests/documents.rs::what_can_be_folded_is_listed_and_folding_it_hides_lines"]
notes = "Elements whose content is on lines of their own (the end tag line stays visible), and comments, CDATA sections, processing instructions and DOCTYPEs over several lines, fold into the line that stands for them, which ends in a … mark. Marks in the gutter fold and open, and so does a click on the …; Fold and Unfold (⌥⌘[ and ⌥⌘]) work on the innermost range at the caret, Fold All, Unfold All and Fold Level 1 to 3 on all. The caret moves over a fold instead of into it, typing at the end of its line keeps it, an edit that touches it, an undo into it and a jump to a match, a message or the outline open it, and folds move with the text (also through undo and redo). `xml_folds` lists what can be folded and `doc_fold` folds headlessly. The ranges come from the analysis, so a command given just after an edit waits for it (about 30 ms) and the marks of ranges that reach past the edit are absent until it arrives. Not yet: folds kept when a file is reopened, folding by indentation in other languages, the text of the fold shown in the mark (it shows only …), a fold level beyond 3 from the menu."

