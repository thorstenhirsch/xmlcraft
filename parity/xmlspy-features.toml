notes = "An XML Schema from one or more documents (`xmlcraft-infer`), in three layouts (Russian doll, Salami slice, Venetian blind) and one schema document per namespace, with imports. The content model of an element is a sequence of repeated choices learned from the order and number of its children (deterministic by construction: every name is in one place; mixed content is a repeated choice), attributes are required when every element has them, `xml:` attributes are referred to through `xml.xsd`, and a schema inferred from documents validates each of them (property test, 1500 cases, every layout and every option set). Headless only: the tool `xml_infer` and `xmlcraft-cli infer`; missing: the Generate Schema dialog in the app and assigning the result to the source document (it is not opened or written by the app yet). Not inferred: keys and keyrefs, `xs:all`, derived types, patterns and length facets, `xsi:type`."

