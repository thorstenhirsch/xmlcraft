notes = "UTF-8, UTF-16 (both orders) and legacy encodings are read, shown in the status bar and written back; a character the encoding cannot hold offers character references or UTF-8. Not yet: reloading as, or converting to, another encoding on request. ISO-8859-1 is read as windows-1252."

