evidence = ["crates/dtd/tests/declarations.rs::the_external_subset_is_read_after_the_internal_one_and_the_internal_declarations_win", "crates/dtd/tests/declarations.rs::what_is_not_a_declaration_is_reported_and_reading_goes_on", "crates/dtd/tests/declarations.rs::spans_say_where_in_the_document_the_problem_is", "crates/engine/src/analysis.rs::the_declarations_of_the_internal_subset_are_read_and_their_mistakes_are_problems", "crates/dtd/src/doctype.rs::the_name_the_identifiers_and_the_subset_are_found"]
notes = "The DOCTYPE and the declarations of its internal subset are read, and every syntax error is a problem with a code and a place (the editor's Messages and `xml_wellformed` show them); the external subset is read through a loader the caller gives (the xmlconf run gives it the suite's files: not-well-formed 64.7% -> 94.8% with valid and invalid still 100%). Missing: the app does not load external subsets yet (no resolver: M2.3), the declarations are not used for anything else (no validation, completion or Info), and entity references in content and attributes are not checked against them (M2.8)."

[[feature]]
id = "dtd.parameter-entities"
title = "Parameter entities, internal and external"
area = "C"
tier = "P0"
milestone = "M2"
status = "partial"
commands = []
tools = ["xml_wellformed"]
evidence = ["crates/dtd/tests/declarations.rs::parameter_entities_between_declarations_bring_their_declarations", "crates/dtd/tests/declarations.rs::parameter_entities_stand_for_their_text_inside_declarations_of_the_external_subset", "crates/dtd/tests/declarations.rs::external_parameter_entities_are_loaded_once_with_their_text_declaration_removed", "crates/dtd/tests/declarations.rs::a_parameter_entity_that_contains_itself_and_one_that_is_not_declared_are_reported", "crates/dtd/tests/declarations.rs::limits_stop_a_hostile_dtd"]
notes = "Parameter entities are expanded as XML 1.0 4.4 says: between declarations everywhere, inside declarations and entity values of the external subset (with the spaces the spec adds), external ones through the loader (read once, text declaration checked and removed), the internal-subset rule (no reference inside a declaration), recursion, undeclared references (an error without an external part, a note with one) a construct that begins in a parameter entity between declarations and ends outside it, and limits (nesting 40, 10 million bytes, 256 loads). Problems are listed up to 1000, then one note says there are more. Missing: validity constraints about nesting of declarations and groups with parameter entities, and the app does not load external ones yet."

