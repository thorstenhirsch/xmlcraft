notes = "XML (so XSD and every other XML file) and a DOCTYPE with its internal subset are coloured line by line from the lexer's mode, in light and dark palettes checked for contrast. Not yet: .dtd, .ent and .mod files as DTD (needs file-type detection), refinements from the syntax tree, JSON and YAML."

