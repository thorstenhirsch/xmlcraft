[[feature]]
id = "editor.syntax-highlighting"
title = "Syntax colouring for XML, XSD, DTD and entity files"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = []
tools = []
evidence = ["crates/syntax/src/highlight.rs::line_by_line_equals_the_whole_text", "crates/ui-egui/src/editor_view.rs::every_class_that_is_read_has_enough_contrast_in_both_themes"]
notes = "XML (so XSD and every other XML file) and a DOCTYPE with its internal subset are coloured line by line from the lexer's mode, in light and dark palettes checked for contrast. Not yet: .dtd, .ent and .mod files as DTD (needs file-type detection), refinements from the syntax tree, JSON and YAML."

