evidence = ["crates/dtd/tests/declarations.rs::attribute_list_declarations_give_types_and_defaults", "crates/dtd/tests/declarations.rs::mistakes_in_attribute_list_declarations", "crates/dtd/tests/compile.rs::id_attributes_have_no_default_and_there_is_one_per_element", "crates/dtd/tests/compile.rs::default_values_must_suit_their_types", "crates/dtd/tests/compile.rs::values_are_read_with_their_references_replaced_and_their_white_space_normalised"]
notes = "All attribute types (CDATA, ID, IDREF(S), ENTITY/ENTITIES, NMTOKEN(S), NOTATION and enumerations) and defaults (#REQUIRED, #IMPLIED, #FIXED, a value) are read, the first declaration of an attribute counts, and every syntax mistake is reported. The validity constraints on the declarations are checked when the DTD is compiled (one ID per element and no default for it, one NOTATION and not on an EMPTY element, distinct tokens, declared notations, default values legal for their type), and attribute values are read as XML 1.0 3.3.3 says (references replaced with limits, white space, collapsing for the types other than CDATA). Missing: nothing validates a document's attributes yet (M2.9), and nothing completes them."

[[feature]]
id = "dtd.general-entities"
title = "General entities with expansion limits"
area = "C"
tier = "P0"
milestone = "M2"
status = "partial"
commands = []
tools = ["xml_wellformed"]
evidence = ["crates/dtd/tests/references.rs::an_entity_must_be_declared_where_the_document_has_all_of_its_declarations", "crates/dtd/tests/references.rs::an_entity_that_refers_to_itself_is_an_error_where_it_is_used", "crates/dtd/tests/references.rs::entities_that_multiply_cost_no_more_than_their_declarations", "crates/engine/src/analysis.rs::references_to_entities_are_checked_against_the_declarations_of_the_document"]
notes = "References to general entities are checked against the declarations, in the document and in attribute default values: declared (where the document has all of its declarations, and always when it is standalone), parsed, not external in an attribute value, no `<` in an attribute value, not recursive, and a replacement text that is well-formed content where it is used; external entities are read through the loader when there is one (text declaration, balanced content). Checking the references expands nothing, each entity is analysed once, so an entity bomb costs no more than its declarations and nesting is bounded (256). Validation (M2.9) does expand: the replacement text of an internal entity is validated in the place it is referred to, within limits (40 levels, 5 million events), attribute values are read as XML 1.0 3.3.3 says, and namespace declarations written with entities are read as the DTD makes them. Missing: external general entities are not read in content when validating, and the editor does not read external entities yet (resolver, M2.3). xmlconf not-well-formed is 100% (1017 of 1017)."

