notes = "Namespaces in XML 1.0 is checked with the well-formedness check (unbound and reserved prefixes, empty bindings, NCName parts of qualified names, duplicate expanded attribute names) and underlined as the text is typed. The xmlconf namespace tests that apply are in the ratchet (docs/target-app-parity.md); xmllint reports these as non-fatal, here they are errors by design."

[[feature]]
id = "validate.dtd"
title = "Validate against a DTD (F8)"
area = "E"
tier = "P0"
milestone = "M2"
status = "partial"
commands = ["xml.validate"]
tools = ["xml_validate"]
evidence = ["crates/ui-egui/tests/validation.rs::f8_says_a_valid_document_is_valid", "crates/automation/tests/validate.rs::the_external_subset_is_a_file_next_to_the_document_and_problems_in_it_name_the_file", "crates/validate/tests/validation.rs::element_content_follows_the_model_and_has_no_text", "crates/validate/tests/validation.rs::attributes_are_declared_required_fixed_and_of_their_type", "crates/validate/tests/validation.rs::ids_are_unique_and_idrefs_name_them", "crates/validate/tests/validation.rs::a_standalone_document_does_not_lean_on_declarations_outside_it", "crates/validate/tests/validation.rs::entities_in_content_are_read_in_the_place_they_are_referred_to"]
notes = "A document with a DOCTYPE is checked against the grammar of its DTD (`xmlcraft_validate::check`): root element type, element valid (declared; EMPTY, ANY, mixed and element content through the automata; text and character references in element content), attributes (declared, required, fixed, types and enumerations, ID unique and IDREF resolved, ENTITY names an unparsed entity, no colon in those names), the standalone document declaration, the declarations' own constraints (duplicates, ID and NOTATION rules, the nesting of parameter entities in declarations, groups and conditional sections), with the replacement text of internal entities read in the place they are referred to. The W3C xmlconf suite is the measure: 721 of 721 valid documents have no error and 227 of 227 invalid ones have at least one (which one is not compared). In the app: Validate (F8, XML menu) checks the document being shown in the background and reports in the status bar, Messages and the underlines; an edit makes the result out of date. Headless: the tool `xml_validate` and `xmlcraft-cli validate` (external parts of the DTD are files, a relative system identifier from the document's folder, through the `--root` confinement for the tool; nothing is downloaded). Missing: validate while typing, external general entities are not read in content, the resolver that finds a DTD by catalog or by the network is M2.3, and the DTD is read again on every validation (no cache)."

[[feature]]
id = "validate.xsd"
title = "Validate against an XSD (F8)"
area = "E"
tier = "P0"
milestone = "M3"
status = "partial"
commands = ["xml.validate"]
tools = ["xml_validate"]
evidence = ["crates/automation/tests/validate.rs::a_document_is_validated_against_a_schema_that_is_given", "crates/automation/tests/validate.rs::a_document_that_names_its_schema_is_validated_against_it", "crates/automation/tests/validate.rs::the_problems_of_a_schema_name_its_file_and_line", "crates/validate/tests/schema_check.rs::the_schema_a_document_names_is_found_and_used", "crates/validate/tests/schema_check.rs::several_schemas_are_used_together", "crates/validate/tests/xsd.rs::children_come_in_the_order_the_model_says", "crates/validate/tests/xsd.rs::simple_values_are_checked_against_their_types", "crates/validate/tests/xsd_identity.rs::a_key_value_cannot_come_twice", "crates/ui-egui/tests/validation.rs::f8_checks_a_document_against_the_schema_it_names", "crates/ui-egui/tests/validation.rs::f8_uses_a_schema_that_is_open_as_it_is_edited", "crates/engine/src/validation.rs::a_document_that_names_a_schema_is_checked_against_it"]
notes = "Spec codes (cvc-*), byte-precise spans. M3.9: `xmlcraft_validate::validate_against_schema` validates a parsed document against an assembled schema: the declaration of the root and of every child through the compiled content models, `xsi:type`, `xsi:nil`, attributes (required, declared, wildcards, fixed), simple values through the datatypes, element defaults and fixed values, IDs and ID references, identity constraints; the schema for schemas validates the bundled schemas. M3.15 (first part): `xmlcraft_validate::check_against_schema` finds the schema a document names (`xsi:schemaLocation`, `xsi:noNamespaceSchemaLocation`; in a document with no DOCTYPE) or is given, loads it through the resolver (files, open documents, the bundle; nothing is downloaded), assembles it and validates; the tool `xml_validate` takes `schema` and the CLI `xmlcraft-cli validate --schema FILE`, and a problem in a schema document names that file and its line. In the app, Validate (F8) checks a document with no DOCTYPE that names a schema against it (the schema documents are the open documents, the schemas that ship with the app and files; nothing is downloaded), lists the problems of the schema documents under the document's own with the file they are in, and says so when the schema cannot be loaded; F8 always checks again, since a schema being edited changes the answer for a document that did not change. Missing: Assign Schema (choosing a schema for a document that names none), the messages do not carry the `cvc-*` names except for datatype violations, default values are not applied, `xs:redefine` is read but not applied, Derivation Valid (Restriction) is not checked, and the W3C xsdtests ratchet (M3.10) is not in."

