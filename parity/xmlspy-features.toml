evidence = ["crates/catalog/tests/resolution.rs::the_entries_are_tried_in_the_order_of_the_spec_and_the_longest_match_wins", "crates/catalog/tests/resolution.rs::a_delegated_catalog_answers_alone_and_a_failed_delegation_does_not_go_back_to_the_list", "crates/catalog/tests/resolution.rs::delegation_restarts_with_only_the_identifier_that_matched", "crates/catalog/tests/resolution.rs::next_catalogs_are_consulted_right_after_the_catalog_that_names_them_and_cycles_end", "crates/catalog/tests/resolution.rs::prefer_decides_whether_a_public_entry_counts_when_a_system_identifier_is_given_too", "crates/catalog/tests/resolution.rs::publicid_urns_are_unwrapped_in_requests_and_entries", "crates/catalog/tests/resolution.rs::uris_are_resolved_by_uri_rewriteuri_urisuffix_and_delegateuri", "crates/automation/tests/catalog.rs::identifiers_and_uris_are_mapped_through_the_catalogs_in_order"]
notes = "The resolution rules of XML Catalogs 1.1 are in `xmlcraft-catalog` (system, public, uri, rewrite*, *Suffix, delegate*, nextCatalog, group, xml:base, prefer; urn:publicid: unwrapping; limits on entries and loads) and reachable headlessly through `catalog_lookup`. Not yet: nothing in the editor or the validators asks the catalogs (the resolver of M2.3 will), no user catalogs setting, and the TR9401 text syntax is not read."

[[feature]]
id = "catalog.bundled-schemas"
title = "Bundled standard schemas that validate offline"
area = "G"
tier = "P0"
milestone = "M2"
status = "partial"
commands = []
tools = []
evidence = ["crates/schemas/tests/bundle.rs::every_file_of_the_folder_is_in_the_bundle_byte_for_byte_and_nothing_else_is", "xtask/src/schemas.rs::a_file_that_is_not_the_one_in_the_manifest_is_refused", "xtask/src/schemas.rs::the_catalogs_may_lead_only_to_what_is_bundled"]
notes = "The files, the catalogs that lead to them and the packing exist: `crates/schemas` embeds `schemas/` (deflated, read one file at a time), `schemas/manifest.toml` pins each file to its URL and SHA-256, and `cargo xtask schemas` (in ci) checks the hashes, the closed licence list, that no schema file is unlisted, that ATTRIBUTION.toml is the one the manifest makes, that every catalog entry leads to a bundled file, and the 250-file cap. In the bundle so far (10 files, W3C): the XML Schema schema, DTD and datatypes DTD, xml.xsd, and the XHTML 1.0 DTDs with their entity sets. Missing: nothing reads the bundle yet (the resolver is M2.3, so no document validates from it), the rest of the core W3C and OASIS set (XHTML 1.1, SVG, MathML, XML Signature, SOAP, WSDL, XSLT, DocBook, SAML, XLIFF) and the ~150-file set of M4."

[[feature]]
id = "catalog.disk-cache"
title = "Cache of downloaded schemas with revalidation"
area = "G"
tier = "P0"
milestone = "M2"
status = "planned"
commands = []
tools = []
evidence = []
notes = "The freshness rules exist in `xmlcraft-resolve` (M2.3, with a cache in memory): a copy is current for 30 days, then asked about with its ETag / Last-Modified, renewed on *not modified*, replaced on a new body, kept and marked stale when the server cannot be reached. The cache on disk is M2.4."

[[feature]]
id = "catalog.auto-download"
