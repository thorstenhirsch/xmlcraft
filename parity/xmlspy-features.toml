evidence = ["crates/engine/src/analysis.rs::problems_are_sorted_by_position_and_counted", "crates/ui-egui/tests/analysis.rs::f7_checks_now_and_opens_messages", "crates/ui-egui/tests/analysis.rs::the_analysis_follows_the_typing", "crates/automation/tests/documents.rs::well_formedness_is_reported_for_a_document_a_file_or_text"]
notes = "XML 1.0 5th edition and Namespaces, on a worker thread after every edit (squiggles, status badge, Messages), at once with F7, and headlessly with the `xml_wellformed` tool and `xmlcraft-cli check`. The DTD is read and the rules that tie entity references to its declarations are applied (M2.6, M2.8, M2.9): every applicable not-well-formed test of the W3C xmlconf suite is rejected (1017 of 1017) and no well-formed one is."

