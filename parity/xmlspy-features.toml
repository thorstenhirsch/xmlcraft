[[feature]]
id = "editor.matching-tags"
title = "Matching tag highlight and jump"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = ["edit.go_to_matching_tag"]
tools = ["xml_matching_tag"]
evidence = ["crates/engine/src/analysis.rs::the_caret_in_a_tag_finds_the_other_tag_of_its_element", "crates/engine/src/analysis.rs::matching_tags_are_symmetrical", "crates/ui-egui/tests/tags.rs::the_names_of_the_pair_the_caret_is_at_are_highlighted", "crates/ui-egui/tests/tags.rs::the_command_goes_to_the_other_tag_and_back", "crates/automation/tests/documents.rs::the_matching_tag_is_found_from_a_position_in_text_a_file_or_a_document"]
notes = "With the caret in or next to a start or end tag, the names of both tags are highlighted, and ⇧⌘\\ (Ctrl+Shift+\\) goes to the other one, to the same place in its name; `xml_matching_tag` answers the same for a position in a file or text. The pairing is the parser's, so a mismatched end tag still goes with its element while a name is being edited. It works from the analysis: after an edit the highlight is back when the new analysis arrives (about 30 ms), and nothing is matched past the first 50,000 elements of a document or in one over 32 MB. Still missing: highlighting the enclosing pair when the caret is in an element's content, and selecting both names."

[[feature]]
id = "editor.auto-close-tags"
title = "Auto-close tags on > and complete end tags on </"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = []
tools = ["doc_type"]
evidence = ["crates/editor/src/typing.rs::a_greater_than_that_ends_a_start_tag_writes_the_end_tag", "crates/editor/src/typing.rs::a_greater_than_anywhere_else_is_a_character", "crates/editor/src/typing.rs::a_slash_after_a_less_than_completes_the_end_tag_of_the_open_element", "crates/code-editor/tests/widget.rs::typing_a_start_tag_writes_its_end_tag_and_enter_splits_the_pair", "crates/automation/tests/documents.rs::typing_and_keys_work_as_the_keyboard_does"]
notes = "Typing `>` that ends a start tag writes the end tag too, with the caret between (not for `/>`, an end tag, a declaration, a value, a comment, or where the end tag is already there); typing `/` after `<` writes the name of the element that is open and the `>`. Each caret decides for itself; `Settings::auto_close` turns both off. What an input method commits and what is pasted are not typing. The element for `</` comes from parsing the text before the caret (not for more than 8 MiB of it). Not yet: closing a `<!--` or a `<![CDATA[`, and completing the end tag from a schema (M2+)."

[[feature]]
id = "editor.auto-indent"
title = "Smart indentation on Enter"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = []
tools = ["doc_key", "doc_type"]
evidence = ["crates/editor/src/typing.rs::enter_indents_after_a_start_tag_and_splits_a_pair", "crates/editor/src/typing.rs::enter_follows_the_documents_line_ending_and_indent_style", "crates/code-editor/tests/widget.rs::typing_a_start_tag_writes_its_end_tag_and_enter_splits_the_pair", "crates/engine/src/document.rs::new_lines_use_the_files_line_ending_and_its_indentation"]
notes = "Enter keeps the indentation of the line; after a start tag (`<a>`, not `</a>`, `<b/>`, a comment or a declaration) the new line is one level deeper, in the document's own indentation and line ending, and between a start tag and an end tag (`<a>|</a>`) the content gets a line and the end tag goes to a line of its own. `Settings::smart_indent` turns it off. Not yet: moving an end tag back one level when it is typed, and re-indenting a pasted block."

[[feature]]
id = "editor.auto-pairing"
title = "Auto-pair quotes and brackets"
area = "A"
tier = "P1"
milestone = "M1"
status = "partial"
commands = []
tools = ["doc_type", "doc_key"]
evidence = ["crates/editor/src/typing.rs::a_quote_after_an_equals_sign_is_paired_and_the_closing_one_stepped_over", "crates/editor/src/typing.rs::a_quote_anywhere_else_is_only_a_character", "crates/editor/src/typing.rs::backspace_between_an_empty_pair_takes_both_quotes", "crates/editor/src/typing.rs::what_is_typed_after_an_edit_elsewhere_is_read_from_the_new_text", "crates/code-editor/tests/widget.rs::a_quote_typed_in_a_tag_is_paired_but_what_an_input_method_commits_is_not", "crates/automation/tests/documents.rs::typing_and_keys_work_as_the_keyboard_does"]
notes = "In a tag, a quote typed after `=` (and before something that is not a name or a quote) writes both quotes with the caret between, the closing quote typed next steps over the one that is there, and Backspace between an empty pair removes both; the place is read with the lexer, so a quote in text, a comment or a value opened by the other quote is only a character. An input method's text and a paste are never paired. Typed with the keyboard through `doc_type` and `doc_key` headlessly. Not yet: pairs for brackets (`<!--`, `[`, `(` in a DOCTYPE), wrapping a selection in quotes, and a Preferences switch (the editor setting `auto_pair` exists)."

[[feature]]
id = "editor.tag-rename-sync"
title = "Rename start and end tag together"
area = "A"
tier = "P1"
milestone = "M1"
status = "partial"
commands = []
tools = ["doc_type", "doc_key"]
evidence = ["crates/editor/src/linked.rs::typing_in_a_name_is_written_into_the_other_name_as_one_undo_step", "crates/editor/src/linked.rs::linked_names_never_drift_apart", "crates/editor/src/linked.rs::stepping_over_the_bracket_leaves_the_name_and_a_torn_tag_is_not_followed", "crates/engine/src/analysis.rs::the_names_to_link_are_those_of_the_tag_the_caret_is_in_the_name_of", "crates/automation/tests/documents.rs::typing_in_the_name_of_a_tag_renames_the_other_tag_of_the_element_too", "crates/ui-egui/tests/tags.rs::typing_in_a_tag_name_renames_the_other_tag_of_the_element"]
notes = "With the single caret in or at the end of a tag name that has a partner, typing or deleting there is written into the other tag of the element as part of the same undo step, with the real keyboard path (the window links the pair from the analysis of the current text; the tools doc_type and doc_key analyse the text first). The link follows the text through edits and ends on a character that is not part of a name, a paste, a word deletion, a selection reaching out of the name, several carets, an undo, or when the names stop being tags. Missing: several carets, paste and word deletion inside a name, a preference to switch it off (Settings::sync_tag_names exists), and a link made while the caret rests in a name before the analysis of the text has arrived."

[[feature]]
id = "editor.comment-toggle"
title = "Toggle comment on selection"
area = "A"
tier = "P0"
milestone = "M1"
status = "partial"
commands = ["edit.toggle_comment"]
tools = ["doc_toggle_comment"]
evidence = ["crates/editor/src/structure.rs::lines_are_commented_out_and_back_in", "crates/editor/src/structure.rs::a_selection_over_lines_is_one_comment", "crates/editor/src/structure.rs::what_cannot_be_in_a_comment_is_refused_and_nothing_changes", "crates/ui-egui/tests/structure.rs::control_slash_comments_the_line_out_and_in_and_says_when_it_cannot", "crates/automation/tests/documents.rs::comments_and_selections_work_on_the_structure"]
notes = "⌘/ (Ctrl+/) wraps the lines the carets touch in `<!-- -->` (one comment for a selection over lines, from its first character that is not blank to the end of its last line) or, when they are exactly one comment, takes the markers off; the caret stays in its text and it is one undo step. A text with `--` in it cannot go into a comment: that is refused and nothing changes. Not yet: toggling a part of a line, and commenting out with CDATA."

[[feature]]
id = "editor.expand-selection"
title = "Expand and shrink selection by syntax node"
