milestone = "M1"
status = "shipped"
commands = ["file.save", "file.save_as"]
tools = ["doc_open", "doc_save"]
evidence = ["crates/engine/src/document.rs::open_then_save_is_the_identity_or_flagged", "crates/ui-egui/tests/documents.rs::typing_and_saving_keep_the_encoding_the_byte_order_mark_and_the_line_endings", "crates/engine/src/document.rs::a_character_the_encoding_cannot_hold_is_reported_and_becomes_a_reference_in_the_text", "crates/automation/tests/documents.rs::a_file_is_opened_read_edited_and_saved_with_its_bytes_kept", "crates/automation/tests/documents.rs::a_file_with_invalid_bytes_is_not_overwritten_but_can_be_saved_elsewhere"]
notes = "For any bytes, a document is flagged lossy or saving gives back exactly the bytes read; saves are atomic (craft-atomic) and keep a symbolic link; a file with invalid bytes is never overwritten; a character the encoding cannot hold is never replaced silently: the user chooses character references (an undoable edit of the text, only in character data and attribute values) or another encoding (which also updates the XML declaration). Edits are not yet minimal diffs of the bytes (the whole file is rewritten, identically)."

