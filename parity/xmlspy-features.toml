milestone = "M1"
status = "partial"
commands = ["edit.expand_selection", "edit.shrink_selection"]
tools = ["doc_expand_selection", "doc_shrink_selection", "doc_select"]
evidence = ["crates/editor/src/structure.rs::a_selection_grows_by_what_the_tree_says", "crates/editor/src/structure.rs::shrinking_goes_back_the_way_it_grew_until_something_else_happens", "crates/editor/src/structure.rs::the_selections_of_several_carets_grow_each_by_itself", "crates/ui-egui/tests/structure.rs::the_selection_grows_and_shrinks_with_the_shortcuts", "crates/automation/tests/documents.rs::comments_and_selections_work_on_the_structure"]
notes = "⌥⌘→ (Ctrl+Alt+→) grows each selection to the smallest thing of the syntax tree that holds it and is bigger: the word, the token, the value without and with its quotes, the attribute, the tag, the content of the element, the element, the one around it; ⌥⌘← goes back the way it grew (not after an edit or a selection made another way). It parses the whole text when asked (not above 8 MiB), so it works on a document that is not well-formed too. Not yet: growing over several siblings at once, and the same through a schema."

