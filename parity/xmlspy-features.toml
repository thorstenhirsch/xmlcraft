notes = "⌘F opens a bar above the editor: text or a regular expression (groups in the replacement as $1), match case, whole word, a counter, next and previous (Enter, F3), Replace and Replace All (one undo step), every match highlighted in the text (up to 10,000 matches, in documents up to 4 MB; a match across lines is highlighted on each of its lines; above 4 MB the bar does not count, and the matches on each line drawn are highlighted, except a match across lines and any on a line longer than 64 KB), and `doc_find` / `doc_replace` headlessly. Replace All refuses more than 10,000 matches or 16 MiB of replacement text, and says so. Still missing: searching only the selection from the bar (the engine can), find history, a replace preview, and find in files (M6)."

