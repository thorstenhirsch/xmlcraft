tier = "P0"
milestone = "M2"
status = "planned"
commands = []
tools = []
evidence = []
notes = "Catalog first; http(s) only; size, time and count limits. The rule exists in `xmlcraft-resolve` (M2.3, tested against a fake server): `auto_download` on by default, an http URL is tried as https first, limits of 10 MiB per download and 256 resources and 64 MiB per load. There is no HTTP client yet (M2.4) and no preference."

