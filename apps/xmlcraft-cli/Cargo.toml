[package]
name = "xmlcraft-cli"
description = "XmlCraft command line: run the automation tools, serve them over MCP, and drive a running app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["mcp"]
# `xmlcraft-cli mcp`, the opt-in Model Context Protocol server.
mcp = ["xmlcraft-automation/mcp"]

[dependencies]
xmlcraft-automation = { workspace = true }
# `check-one`: the self-check the fuzzer runs.
xmlcraft-engine = { workspace = true }
serde_json = { workspace = true }
# Screenshots from the running app arrive as base64 PNGs.
base64 = "0.23"

[dev-dependencies]
tempfile = "3"
